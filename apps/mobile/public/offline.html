<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#9333ea">
  <title>AçaíFood: sem internet</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #09090b; color: #f4f4f5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
    .card { max-width: 360px; text-align: center; }
    .icon { font-size: 56px; }
    h1 { font-size: 22px; margin: 12px 0 8px; }
    p { color: #a1a1aa; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
    button { background: #9333ea; color: #fff; border: 0; border-radius: 14px; padding: 14px 28px; font-size: 15px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>Você está sem internet</h1>
    <p>O AçaíFood precisa de conexão para mostrar as lojas, os pedidos e o Pix. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
